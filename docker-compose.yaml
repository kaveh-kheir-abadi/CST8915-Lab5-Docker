services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    ports:
      - "15672:15672" # Optional management UI; omit if unused.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  order-service:
    image: order-service:latest
    build: ./order-service-L4
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_CONNECTION_STRING: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      PORT: "3000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  product-service:
    image: product-service:latest
    build: ./product-service-python-L4
    ports:
      - "3030:3030"
    environment:
      PORT: "3030"

  store-front:
    image: store-front:latest
    build:
      context: ./store-front-L4
      args:
        VUE_APP_ORDER_SERVICE_URL: http://${API_HOST:-localhost}:3000
        VUE_APP_PRODUCT_SERVICE_URL: http://${API_HOST:-localhost}:3030
    ports:
      - "8080:80"
    depends_on:
      - product-service
      - order-service

volumes:
  rabbitmq-data: